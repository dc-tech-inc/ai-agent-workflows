name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The MCP server consumed by examples/mcp-client, built from this exact commit of dc-tech-inc/mcp-tool-server.
  MCP_TOOL_SERVER_SHA: 9f972fe0370d48ce40ac7cd7ddaefddaa3c1783f

jobs:
  check:
    name: Lint, typecheck, test, evals, build, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so gitleaks scans every commit, not only the tip.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Build the MCP server the integration test talks to
        run: |
          git clone --quiet https://github.com/dc-tech-inc/mcp-tool-server "$RUNNER_TEMP/mcp-tool-server"
          git -C "$RUNNER_TEMP/mcp-tool-server" checkout --quiet "$MCP_TOOL_SERVER_SHA"
          cd "$RUNNER_TEMP/mcp-tool-server"
          pnpm install --frozen-lockfile
          pnpm build
      - name: Test with coverage (includes the MCP integration test)
        env:
          MCP_TOOL_SERVER_DIST: ${{ runner.temp }}/mcp-tool-server/dist/index.js
        run: pnpm coverage
      - name: Evals (offline, deterministic)
        run: pnpm evals
      - name: Secret scan, working tree (secretlint)
        run: pnpm secrets
      - name: Secret scan, full git history (gitleaks release binary)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --redact
